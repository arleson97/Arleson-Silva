<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Portfólio</title>
    <!-- Link para o arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabeçalho / Menu de Navegação -->
    <header class="cabecalho">
        <h1 class="logo">MeuPortfólio.dev</h1>
        <nav class="menu">
            <a href="#sobre">Sobre</a>
            <a href="#projetos">Projetos</a>
            <a href="#contato">Contato</a>
        </nav>
    </header>

    <!-- Conteúdo Principal -->
    <main class="conteudo-principal">

        <!-- Foto de Perfil / Avatar -->
        <div class="avatar">
            🚀
        </div>

        <!-- Apresentação -->
        <h2 class="titulo-principal">
            Olá, eu sou <span class="destaque">Seu Nome</span>
        </h2>

        <p class="descricao">
            Bem-vindo à minha página pessoal hospedada no GitHub Pages! Aqui compartilho um pouco sobre mim e meus projetos de tecnologia.
        </p>

        <!-- Botões -->
        <div class="botoes">
            <a href="https://github.com/SEU-USUARIO" target="_blank" class="btn btn-principal">Ver GitHub</a>
            <a href="#contato" class="btn btn-secundario">Fale Comigo</a>
        </div>

    </main>

    <!-- Rodapé -->
    <footer class="rodape">
        <p>&copy; 2026 Seu Nome. Feito com HTML & CSS puro.</p>
    </footer>

</body>
</html>
